# Generated by Fito Deploy. Manual edits will be overwritten on next Sync.
name: deploy-production
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to deploy again (rollback). Empty deploys the branch as it is.'
        required: false
        type: string
concurrency:
  group: "dimaslz-cv-production"
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: check commit
        env:
          SHA_INPUT: ${{ inputs.sha }}
        run: |
          if [ -n "$SHA_INPUT" ] && ! [[ "$SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Not a commit::The sha input must be a full 40-character lower-case commit sha"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: ${{ inputs.sha && '0' || '1' }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: find image
        id: reuse
        env:
          SHA_INPUT: ${{ inputs.sha }}
        run: |
          if [ -z "$SHA_INPUT" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reuse=false
          if docker manifest inspect "ghcr.io/dimaslz/dimaslz-cv:$SHA_INPUT" > /dev/null 2>&1; then
            reuse=true
            echo "The image of $SHA_INPUT is in the registry, nothing is built. Fito deploys the digest it stored for that commit; a deployment from before digest pinning has none and is deployed by its tag."
          fi
          branch_ref="refs/remotes/origin/main"
          if ! tip=$(git show-ref --verify --hash "$branch_ref" 2> /dev/null); then
            echo "::error title=Branch not fetched::$branch_ref is missing, so the commit cannot be checked against main"
            exit 1
          fi
          if git merge-base --is-ancestor "$SHA_INPUT" "$tip"; then
            on_branch=true
          else
            code=$?
            if [ "$code" -ne 1 ]; then
              echo "::error title=Commit check failed::git could not compare $SHA_INPUT with main (exit $code)"
              exit 1
            fi
            on_branch=false
          fi
          if [ "$on_branch" != true ]; then
            if [ "$reuse" != true ]; then
              echo "::error title=Commit not on main::$SHA_INPUT is not on main, so it is not built with the secrets of this environment"
              exit 1
            fi
            echo "::warning title=Commit not on main::$SHA_INPUT is no longer on main (rebased or force-pushed?). Fito deploys it only if it deployed it successfully before"
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - name: find pnpm version
        id: pnpm
        if: "steps.reuse.outputs.reuse != 'true'"
        run: |
          if jq -e '(.packageManager | type) == "string" and (.packageManager | length) > 0' package.json > /dev/null 2>&1; then
            version=""
          else
            lockfile=$(grep -m1 '^lockfileVersion' pnpm-lock.yaml 2> /dev/null || true)
            major=$(printf '%s' "$lockfile" | sed -E "s/^lockfileVersion:[[:space:]]*['\"]?([0-9]+).*/\1/")
            case "$major" in
              6) version=8 ;;
              5) version=7 ;;
              *) version=9 ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: "steps.reuse.outputs.reuse != 'true'"
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@v4
        if: "steps.reuse.outputs.reuse != 'true'"
        with:
          node-version: "24"
          cache: pnpm
      - name: "setup"
        if: "steps.reuse.outputs.reuse != 'true'"
        run: |
          pnpm install --frozen-lockfile
      - name: "lint"
        if: "steps.reuse.outputs.reuse != 'true'"
        run: |
          pnpm run lint
      - name: "test"
        if: "steps.reuse.outputs.reuse != 'true'"
        run: |
          pnpm run test
      - uses: docker/setup-buildx-action@v3
        if: "steps.reuse.outputs.reuse != 'true'"
      - name: build image
        id: build
        if: "steps.reuse.outputs.reuse != 'true'"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dimaslz/dimaslz-cv:${{ inputs.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: deploy
        env:
          RUNTIME_KEYS: "API_DIMASLZ_URL"
          FITO_ENV_API_DIMASLZ_URL: ${{ secrets.API_DIMASLZ_URL || vars.API_DIMASLZ_URL }}
          TARGET_SHA: "${{ inputs.sha || github.sha }}"
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REUSED: ${{ steps.reuse.outputs.reuse }}
          FITO_API_URL: ${{ vars.FITO_API_URL }}
          FITO_DEPLOY_TOKEN: ${{ secrets.FITO_DEPLOY_TOKEN }}
        run: |
          # Only the runtime keys leave GitHub, in the body of an HTTPS request to Fito.
          status=$(jq -n --arg image "ghcr.io/dimaslz/dimaslz-cv:$TARGET_SHA" --arg sha "$TARGET_SHA" \
            --arg digest "$IMAGE_DIGEST" --arg reused "$IMAGE_REUSED" \
            --arg keys "$RUNTIME_KEYS" \
            '{image: $image, sha: $sha,
              env: ($keys | split(",") | map(select(. != "") | {key: ., value: ($ENV["FITO_ENV_" + .] // "")} | select(.value != "")) | from_entries)}
              + (if $digest == "" then {} else {imageDigest: $digest} end)
              + (if $reused == "true" then {imageReused: true} else {} end)' \
          | curl -sS --max-time 60 -o response.json -w "%{http_code}" -X POST "$FITO_API_URL/v1/deploy" \
              -H "Authorization: Bearer $FITO_DEPLOY_TOKEN" \
              -H "Content-Type: application/json" --data @-)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            # Only the answer of Fito (its error code and message, never the request) goes to the log.
            jq -r --arg s "$status" '"::error title=Fito refused the deploy::HTTP \($s) \(.error // "error"): \((.message // "") | gsub("[\\r\\n]"; " "))"' response.json 2>/dev/null \
              || echo "::error::Fito answered HTTP $status"
            exit 1
          fi
